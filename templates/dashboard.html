<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Complaint Analytics Dashboard</h1>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white p-4 rounded-xl shadow"><canvas id="deptChart"></canvas></div>
      <div class="bg-white p-4 rounded-xl shadow"><canvas id="priorityChart"></canvas></div>
      <div class="bg-white p-4 rounded-xl shadow"><canvas id="responseChart"></canvas></div>
      <div class="bg-white p-4 rounded-xl shadow"><canvas id="trendChart"></canvas></div>
    </div>
    <a href="/" class="text-blue-600 mt-4 inline-block">← Back</a>
  </div>
</body>
</html>
