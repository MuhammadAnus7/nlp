<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Complaint Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-slate-800 mb-6">AI-Powered Complaint & Query Portal</h1>

    <div class="grid md:grid-cols-2 gap-6">
      <section class="bg-white p-5 rounded-xl shadow-lg transition hover:shadow-2xl">
        <h2 class="text-xl font-semibold mb-3">Submit Complaint</h2>
        <textarea id="complaintText" class="w-full border rounded p-3" rows="5" placeholder="Describe your complaint..."></textarea>
        <button id="submitComplaint" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Submit</button>
        <div id="complaintResult" class="mt-3 text-sm"></div>
      </section>

      <section class="bg-white p-5 rounded-xl shadow-lg transition hover:shadow-2xl">
        <h2 class="text-xl font-semibold mb-3">Ask a Question</h2>
        <input id="queryText" class="w-full border rounded p-3" placeholder="Ask your question..." />
        <button id="submitQuery" class="mt-3 bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700">Ask AI</button>
        <div id="queryResult" class="mt-3 text-sm"></div>
      </section>
    </div>

    <div id="toast" class="fixed right-6 bottom-6 bg-slate-900 text-white px-4 py-2 rounded shadow hidden"></div>
    <div class="mt-8 space-x-4">
      <a class="text-blue-600" href="/admin">Admin Panel</a>
      <a class="text-blue-600" href="/dashboard">Analytics Dashboard</a>
    </div>
  </div>
</body>
</html>
