<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Complaint Helpdesk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { animation: { float: 'float 5s ease-in-out infinite' }, keyframes: { float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }}}}};
  </script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-fuchsia-900 text-white">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(56,189,248,0.20),_transparent_40%),radial-gradient(circle_at_bottom_right,_rgba(168,85,247,0.20),_transparent_40%)]"></div>

  <main class="relative z-10 max-w-7xl mx-auto px-4 py-8 md:py-12">
    <header class="mb-8 text-center animate-float">
      <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">AI Complaint Management System</h1>
      <p class="text-slate-200 mt-2">Smart routing, sentiment-aware prioritization, and instant query support.</p>
    </header>

    <section class="grid lg:grid-cols-2 gap-6">
      <div class="bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 shadow-2xl p-6">
        <h2 class="text-2xl font-semibold mb-4">Submit a Complaint</h2>
        <textarea id="complaintText" rows="6" class="w-full rounded-xl bg-slate-900/60 border border-slate-600 p-3 focus:outline-none focus:ring-2 focus:ring-cyan-400" placeholder="Describe your issue in detail..."></textarea>
        <button id="submitComplaint" class="mt-4 w-full bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl py-3 font-semibold shadow-lg hover:shadow-cyan-500/30 hover:scale-[1.01] transition">Submit Complaint</button>
        <div id="complaintLoader" class="hidden mt-3 text-cyan-300 text-sm">Analyzing complaint...</div>
        <div id="complaintResult" class="hidden mt-4 rounded-xl bg-slate-900/60 border border-slate-700 p-4 text-sm"></div>
      </div>

      <div class="bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 shadow-2xl p-6">
        <h2 class="text-2xl font-semibold mb-4">AI Query Chatbot</h2>
        <input id="queryText" class="w-full rounded-xl bg-slate-900/60 border border-slate-600 p-3 focus:outline-none focus:ring-2 focus:ring-fuchsia-400" placeholder="Ask your question..." />
        <button id="submitQuery" class="mt-4 w-full bg-gradient-to-r from-fuchsia-500 to-purple-600 rounded-xl py-3 font-semibold shadow-lg hover:shadow-fuchsia-500/30 hover:scale-[1.01] transition">Ask AI</button>
        <div id="queryLoader" class="hidden mt-3 text-fuchsia-300 text-sm">Finding best answer...</div>
        <div id="queryResult" class="hidden mt-4 rounded-xl bg-slate-900/60 border border-slate-700 p-4 text-sm"></div>
      </div>
    </section>

    <nav class="mt-8 flex flex-wrap gap-3 justify-center">
      <a href="/admin" class="px-4 py-2 rounded-xl bg-white/10 border border-white/20 hover:bg-white/20 transition">Admin Panel</a>
      <a href="/dashboard" class="px-4 py-2 rounded-xl bg-white/10 border border-white/20 hover:bg-white/20 transition">Analytics Dashboard</a>
    </nav>
  </main>

  <div id="toast" class="hidden fixed right-4 bottom-4 rounded-lg px-4 py-3 shadow-lg text-white"></div>
</body>
</html>
