<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="{{ url_for('static', filename='js/admin.js') }}"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-900 text-white">
  <main class="max-w-7xl mx-auto px-4 py-8">
    <header class="flex flex-wrap gap-3 justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">Complaint Admin Panel</h1>
      <a href="/" class="px-4 py-2 rounded-xl bg-white/10 border border-white/20 hover:bg-white/20">Back to Portal</a>
    </header>

    <section class="bg-white/10 border border-white/20 backdrop-blur-xl rounded-2xl p-4 mb-5">
      <div class="grid md:grid-cols-[1fr_auto] gap-3">
        <input id="departmentFilter" class="rounded-xl bg-slate-900/70 border border-slate-700 p-3" placeholder="Filter by department e.g. finance" />
        <button id="loadComplaints" class="rounded-xl bg-gradient-to-r from-indigo-500 to-blue-600 px-5 py-3 font-semibold">Refresh</button>
      </div>
    </section>

    <section class="bg-white/10 border border-white/20 backdrop-blur-xl rounded-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-900/70 text-slate-200">
            <tr>
              <th class="p-3 text-left">ID</th>
              <th class="p-3 text-left">Complaint</th>
              <th class="p-3 text-left">Department</th>
              <th class="p-3 text-left">Priority</th>
              <th class="p-3 text-left">Sentiment</th>
              <th class="p-3 text-left">Status</th>
              <th class="p-3 text-left">Action</th>
            </tr>
          </thead>
          <tbody id="complaintsTable"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="adminToast" class="hidden fixed right-4 bottom-4 rounded-lg px-4 py-3 shadow-lg"></div>
</body>
</html>
